# Ultralytics YOLO 🚀, AGPL-3.0 license
# 以CBAM为核心，融合P2small和BiFPN（通道统一版）

# Parameters
nc: 6
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # ---------- 通道统一（BiFPN 统一到256）----------
  - [4, 1, Conv, [256]] # 11-P3/8 → 256ch
  - [6, 1, Conv, [256]] # 12-P4/16 → 256ch
  - [10, 1, Conv, [256]] # 13-P5/32 → 256ch

  # BiFPN 上采样融合 P5->P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 12], 1, Bi_FPN, []] # 15 (输入256+256)
  - [-1, 3, C3k2, [256, False]] # 16-P4/16

  # BiFPN 上采样融合 P4->P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 11], 1, Bi_FPN, []] # 18 (输入256+256)
  - [-1, 3, C3k2, [256, False]] # 19-P3/8
  - [-1, 1, CBAM, []] # 20 CBAM on P3

  # P2small 分支（小目标）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 21
  - [[-1, 2], 1, Concat, [1]] # 22 cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 23-P2/4
  - [-1, 1, CBAM, []] # 24 CBAM on P2

  # 融合 P2 与 P3（先下采样，再拼接，通道差异由C3k2统一）
  - [-1, 1, Conv, [128, 3, 2]] # 25 P2下采样至P3尺度
  - [[-1, 11, 19], 1, Concat, [1]] # 26 concat: 下采样P2(128) + 原始P3(256) + 增强P3(256)
  - [-1, 3, C3k2, [256, False]] # 27-P3/8（融合后）
  - [-1, 1, CBAM, []] # 28 CBAM on fused P3

  # 下采样融合 P3->P4（BiFPN）
  - [-1, 1, Conv, [256, 3, 2]] # 29
  - [[-1, 12, 16], 1, Bi_FPN, []] # 30 (输入256+256+256)
  - [-1, 3, C3k2, [512, False]] # 31-P4/16

  # 下采样融合 P4->P5（BiFPN）
  - [-1, 1, SCDown, [256, 3, 2]] # 32
  - [[-1, 13], 1, Bi_FPN, []] # 33 (输入256+256)
  - [-1, 3, C3k2, [1024, True]] # 34-P5/32

  # 检测头（四个尺度）
  - [[23, 27, 31, 34], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
